[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-dtnaas"
description = "Janus DTNaaS Controller"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD 3-Clause License"}
authors = [
    {name = "Ezra Kissel", email = "kissel@es.net"}
]
keywords = ["Janus", "Controller"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "cryptography",
    "Flask>=3.0.2",
    "flask-openapi3[swagger,scalar]>=4.3.1",
    "Flask-httpauth>=4.8.0",
    "flask-sock>=0.7.0",
    "PyJWT>=2.10.1",
    "Flask-JWT-Extended>=4.7.1",
    "portainer-api",
    "psutil",
    "py-cpuinfo",
    "pyyaml",
    "requests",
    "six",
    "tinydb",
    "virtfs",
    "tcconfig",
    "Werkzeug>=3.0.1",
    "pydantic>=2.12.0",
    "ansible-tower-cli==3.3.8",
    "pytest-xprocess",
    "kubernetes>=29.0.0",
    "openapi-slurm-0.0.38-client",
    "sense-o-api==1.37",
    "pytest-cov",
    "coverage",
]

[project.urls]
Homepage = "https://github.com/esnet/janus"

[project.scripts]
janus-ctrl = "janus.app:main"

[tool.setuptools.dynamic]
version = {attr = "janus.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["janus*"]

[tool.setuptools.package-data]
janus = ["config/*", "config/profiles/*"]
